name: Publish to Comfy Registry

# Publishes the node pack to registry.comfy.org whenever the version in
# pyproject.toml changes on main, or when run by hand from the Actions tab.
# Needs the REGISTRY_ACCESS_TOKEN repository secret (a Comfy Registry API key).
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish custom node to the registry
    runs-on: ubuntu-latest
    # Forks have no registry key; skip instead of failing.
    if: ${{ github.repository_owner == 'spicyapi-ai' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
